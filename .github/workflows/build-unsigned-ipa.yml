# ============================================================================
# 云端打包「未签名 IPA」—— 原生 Xcode 项目（Swift / Objective-C）
#
# 放到项目根目录：.github/workflows/build-unsigned-ipa.yml
# 推送后到仓库 Actions 页面看进度，产物在本次运行的 Artifacts 区。
#
# 这个 workflow 不配置任何证书、不配置任何描述文件，构建时关闭代码签名，
# 产出的是「未签名 IPA」，需要用免费 Apple ID（Sideloadly / AltStore /
# SideStore）或自备证书重签之后才能装到 iPhone 上。
# ============================================================================

name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要；若只想传 Artifact 可改为 read

env:
  # 镜像默认 Xcode 路径。可用值随镜像不同：
  #   macos-15 镜像：/Applications/Xcode_16.4.app（默认）、Xcode_16.0~16.4、Xcode_26.0.1~26.3
  #   macos-26 镜像：/Applications/Xcode_26.6.app（默认）、Xcode_26.0.1~26.6
  # 完整列表见 https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
  XCODE_PATH: /Applications/Xcode_16.4.app
  # 想手动指定 scheme 就填在这里，留空则自动探测
  SCHEME: "WaterCheckIn"
  PRODUCT_NAME: "WaterCheckIn"

jobs:
  build:
    name: Build unsigned IPA
    # ⚠️ 不要用 macos-latest。它是「移动标签」，GitHub 升级系统时会自动切过去
    #    （2026-06 已从 macOS 15 切到 macOS 26），会让某天构建毫无征兆地失败。
    #    锁定具体版本：
    #      macos-15 → 默认 Xcode 16.4，跑老项目更稳
    #      macos-26 → 默认 Xcode 26.6，需要 iOS 26 SDK 时用
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境探测
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: 安装 XcodeGen 并生成工程
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          ls -d *.xcodeproj

      - name: 安装 CocoaPods 依赖
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install --repo-update || pod install
          else
            echo "没有 Podfile，跳过"
          fi

      - name: 探测 workspace / project
        id: probe
        run: |
          set -euo pipefail
          WS="$(find . -maxdepth 2 -name '*.xcworkspace' -not -path '*/.*' | head -1 || true)"
          PRJ="$(find . -maxdepth 2 -name '*.xcodeproj' -not -path '*/.*' | head -1 || true)"
          if [ -n "$WS" ]; then
            echo "flag=-workspace" >> "$GITHUB_OUTPUT"
            echo "container=$WS"  >> "$GITHUB_OUTPUT"
          elif [ -n "$PRJ" ]; then
            echo "flag=-project"   >> "$GITHUB_OUTPUT"
            echo "container=$PRJ"  >> "$GITHUB_OUTPUT"
          else
            echo "::error::找不到 .xcworkspace 或 .xcodeproj"
            exit 1
          fi
          echo "检测到容器: $WS $PRJ"

      - name: 探测 scheme
        id: scheme
        run: |
          set -euo pipefail
          if [ -n "$SCHEME" ]; then
            echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
            echo "使用手动指定 scheme: $SCHEME"
            exit 0
          fi
          JSON="$(xcodebuild ${{ steps.probe.outputs.flag }} "${{ steps.probe.outputs.container }}" -list -json)"
          echo "$JSON"
          SCHEME_FOUND="$(printf '%s' "$JSON" | python3 -c "
import sys, json
d = json.load(sys.stdin)
node = d.get('workspace') or d.get('project') or {}
schemes = node.get('schemes') or []
print(schemes[0] if schemes else '')
")"
          if [ -z "$SCHEME_FOUND" ]; then
            echo "::error::没有探测到 scheme，请在 workflow 的 env.SCHEME 里手动指定"
            exit 1
          fi
          echo "scheme=$SCHEME_FOUND" >> "$GITHUB_OUTPUT"
          echo "自动探测到 scheme: $SCHEME_FOUND"

      - name: Archive（关闭代码签名）
        run: |
          set -euo pipefail
          xcodebuild archive \
            ${{ steps.probe.outputs.flag }} "${{ steps.probe.outputs.container }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -300

      - name: 打包成未签名 IPA
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/build/App.xcarchive"
          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::archive 里没有找到 .app"
            exit 1
          fi
          echo "App: $APP"
          mkdir -p "$RUNNER_TEMP/out/Payload"
          # ditto 保留符号链接与扩展属性；符号链接丢了会导致装不上
          ditto "$APP" "$RUNNER_TEMP/out/Payload/$(basename "$APP")"
          cd "$RUNNER_TEMP/out"
          zip -qry "${PRODUCT_NAME}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "${PRODUCT_NAME}-unsigned.ipa"

      - name: 校验产物确实是未签名的
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/out/${PRODUCT_NAME}-unsigned.ipa"
          unzip -l "$IPA" | head -30
          if unzip -l "$IPA" | grep -q '_CodeSignature/'; then
            echo "::error::产物里出现 _CodeSignature/，签名没有被完全关闭"
            exit 1
          fi
          if unzip -l "$IPA" | grep -q 'embedded.mobileprovision'; then
            echo "::error::产物里出现 embedded.mobileprovision，这不是未签名包"
            exit 1
          fi
          echo "✅ 已确认是未签名 IPA"

      - name: 上传 Artifact（需登录 GitHub 才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（免登录下载链接）
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/out/${PRODUCT_NAME}-unsigned.ipa"
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$IPA" \
            --title "${PRODUCT_NAME} 未签名 IPA ${TAG}" \
            --notes "由 GitHub Actions 在 macOS runner 上构建的**未签名** IPA。

需要用免费 Apple ID（Sideloadly / AltStore / SideStore）或自备证书重签后才能安装。" \
            --latest
          echo "下载页: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
